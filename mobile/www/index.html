<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UniPath</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #ffffff;
        color: #171717;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .brand {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .msg {
        font-size: 14px;
        color: #71717a;
        max-width: 320px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">UniPath</div>
      <div class="msg">Unable to reach UniPath. Please check your internet connection and reopen the app.</div>
    </div>
  </body>
</html>
